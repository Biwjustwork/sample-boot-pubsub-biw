spring.application.name=library-borrow-service
server.port=8200

# Where the broker is.
#
# Two addresses for the same broker, and which one you need depends on where
# YOUR PROGRAM runs:
#   - from your own machine (mvn spring-boot:run):  localhost:9094
#   - from inside a Docker container:               kafka:9092
# In this sample the services run on your machine, so the default is 9094. In
# the lab the services run in Docker, so there it is kafka:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Events are plain text on the wire. The producer must say how to turn the key
# and the value into bytes - here: strings.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# The channel this service publishes on.
app.kafka.topic=borrows
