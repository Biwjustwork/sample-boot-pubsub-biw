spring.application.name=library-activity-service
server.port=8203

# Where the broker is. Same note as in borrow-service: 9094 from your machine,
# kafka:9092 from inside Docker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Where a BRAND NEW group starts reading: at the earliest event still on the
# topic. This line is what makes the replay in step 5 possible - a new group
# does not start "from now", it starts from the beginning of the log.
spring.kafka.consumer.auto-offset-reset=earliest

# The channel this service listens on.
app.kafka.topic=borrows

# Its own database, in memory. That matters for step 5: restart the service and
# this table is EMPTY - but the events are still on the topic.
spring.datasource.url=jdbc:h2:mem:popularitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
