$kind: http-request
description: |-
  One row per borrow event. The producer never called this service - the broker delivered the event to its @KafkaListener.

  Easier to watch as the page: http://localhost:8201/
url: "{{notificationService}}/notifications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("answers 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("step 2: the event became a notification", function () {
          const bodies = pm.response.json().map(n => n.bookTitle);
          pm.expect(bodies).to.include("1984");
      });
    language: text/javascript
order: 1000
