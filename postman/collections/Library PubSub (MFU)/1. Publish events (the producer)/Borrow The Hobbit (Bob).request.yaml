$kind: http-request
description: "A second borrow, different book and member. Send the 1984 request several times and this one once, then look at the popularity page: 1984 climbs, The Hobbit stays at 1."
url: "{{borrowService}}/borrows"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "bookTitle": "The Hobbit",
        "memberName": "Bob Smith"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("answers 201", function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 2000
