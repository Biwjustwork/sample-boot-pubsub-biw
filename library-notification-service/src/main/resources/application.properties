spring.application.name=library-notification-service
server.port=8201

# Where the broker is. Same note as in borrow-service: 9094 from your machine,
# kafka:9092 from inside Docker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# The mirror of the producer's serializers: how to turn bytes back into a key
# and a value.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Where a BRAND NEW group starts reading: at the earliest event still on the
# topic, not only from now on. Step 5 of the demo depends on this line.
spring.kafka.consumer.auto-offset-reset=earliest

# The channel this service listens on.
app.kafka.topic=borrows

# Its own database, in memory.
spring.datasource.url=jdbc:h2:mem:notificationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
